<svg
  width="64"
  height="64"
  viewBox="0 0 64 64"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <filter
      id="glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="3"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter
      id="strongGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Dark background -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="16"
    fill="#07101d"
  />

  <!-- Outer cyan glow -->
  <rect
    x="4"
    y="4"
    width="56"
    height="56"
    rx="15"
    fill="none"
    stroke="#22d3ee"
    stroke-width="3"
    opacity="0.8"
    filter="url(#strongGlow)"
  />

  <!-- Bright cyan border -->
  <rect
    x="7"
    y="7"
    width="50"
    height="50"
    rx="13"
    fill="none"
    stroke="#67e8f9"
    stroke-width="2"
    filter="url(#glow)"
  />

  <!-- Cyan inner square -->
  <rect
    x="12"
    y="12"
    width="40"
    height="40"
    rx="10"
    fill="#22d3ee"
  />

  <!-- NX -->
  <text
    x="32"
    y="39"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21"
    font-weight="900"
    letter-spacing="-1"
    fill="#020617"
  >
    NX
  </text>

</svg>